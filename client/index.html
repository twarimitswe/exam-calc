<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator DApp</title>
    <!-- Include Web3.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>
    <h1>Calculator DApp</h1>

    <!-- Arithmetic Section -->
    <input type="number" id="numA" placeholder="Number A">
    <input type="number" id="numB" placeholder="Number B">
    <br><br>
    <button id="addBtn">Add</button>
    <button id="subBtn">Subtract</button>
    <button id="mulBtn">Multiply</button>
    <button id="divBtn">Divide</button>
    <br><br>
    <div>Result: <span id="calcResult">0</span></div>

    <hr>

    <!-- Name Section -->
    <h2>Set/Get Name</h2>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button id="setNameBtn">Set Name</button>
    <button id="getNameBtn">Get Name</button>
    <br><br>
    <div>Hello World, <span id="nameResult">...</span></div>

    <script src="app.js"></script>
</body>
</html>
